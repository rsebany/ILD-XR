version: "3.9"

services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ild_xr
      POSTGRES_USER: ild_xr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ild_xr_dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ild_xr"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Backend API + AI ────────────────────────────────────────────────────────
  backend-api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://ild_xr:${POSTGRES_PASSWORD:-ild_xr_dev}@postgres:5432/ild_xr
      API_HOST: "0.0.0.0"
      API_PORT: "8000"
      API_RELOAD: "0"
      ILD_JWT_SECRET: ${ILD_JWT_SECRET:-change-this-in-production}
      FRONTEND_BASE_URL: http://localhost:3000
      TORCH_NUM_THREADS: "2"
      AI_FORCE_CPU: "false"
    ports:
      - "8000:8000"
    volumes:
      # Model weights (required — mount your trained weights)
      - ./backend-api/weights:/app/backend-api/weights:ro
      # Persistent data
      - ./backend-api/data:/app/backend-api/data
      - ./backend-api/static/meshes:/app/backend-api/static/meshes

  # ── Frontend (Next.js) ─────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    depends_on:
      - backend-api
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"

volumes:
  pgdata:
